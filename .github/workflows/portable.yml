name: Windows release build
on:
  push:
    branches: [main, fix/startup-login]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Startup registration and login regression tests
        run: dotnet run --project tests/StartupTests -c Release
      - name: Credential persistence regression tests
        run: dotnet run --project tests/CredentialTests -c Release
      - name: Online device list parsing regression tests
        run: dotnet run --project tests/DeviceListTests -c Release
      - name: Device guard and connection rules regression tests
        run: dotnet run --project tests/GuardTests -c Release
      # tests/LiveCheck 需要真实校园网（要能连到 202.117.144.205 的 Portal 并拿到真实 SSID），
      # GitHub runner 上跑不了，因此不进 CI。它是给本机用的实机验证入口。
      - name: Build installer and portable archive
        shell: pwsh
        run: ./tools/build_release.ps1
      - name: Check self-contained dependencies
        shell: pwsh
        run: |
          $publish = Get-ChildItem artifacts/staging-*/SNNUAutoLogin-Portable-*-win-x64 -Directory | Select-Object -First 1
          python -X utf8 tools/check_deps.py $publish.FullName
      - name: Installer install, launch and uninstall smoke test
        shell: pwsh
        run: ./tools/test_installer.ps1 -Installer (Resolve-Path artifacts/SNNUAutoLogin-Setup-*.exe)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SNNUAutoLogin-Release-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
