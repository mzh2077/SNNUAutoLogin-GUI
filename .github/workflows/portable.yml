name: Windows release build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable.yml'
      - '*.cs'
      - '*.xaml'
      - '*.csproj'
      - 'app.manifest'
      - 'runtimeconfig.template.json'
      - 'Assets/**'
      - 'Services/**'
      - 'Shared/**'
      - 'installer/**'
      - 'tools/**'
      - 'tests/StartupTests/**'
      - 'tests/CredentialTests/**'
      - 'tests/DeviceListTests/**'
      - 'tests/GuardTests/**'
      - 'tests/WindowBehaviorTests/**'
  pull_request:
    paths:
      - '.github/workflows/portable.yml'
      - '*.cs'
      - '*.xaml'
      - '*.csproj'
      - 'app.manifest'
      - 'runtimeconfig.template.json'
      - 'Assets/**'
      - 'Services/**'
      - 'Shared/**'
      - 'installer/**'
      - 'tools/**'
      - 'tests/StartupTests/**'
      - 'tests/CredentialTests/**'
      - 'tests/DeviceListTests/**'
      - 'tests/GuardTests/**'
      - 'tests/WindowBehaviorTests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Startup registration and login regression tests
        run: dotnet run --project tests/StartupTests -c Release -- --registry-integration
      - name: Credential persistence regression tests
        run: dotnet run --project tests/CredentialTests -c Release
      - name: Online device list parsing regression tests
        run: dotnet run --project tests/DeviceListTests -c Release
      - name: Device guard and connection rules regression tests
        run: dotnet run --project tests/GuardTests -c Release
      # tests/LiveCheck 需要真实校园网（要能连到 202.117.144.205 的 Portal 并拿到真实 SSID），
      # GitHub runner 上跑不了，因此不进 CI。它是给本机用的实机验证入口。
      - name: Window docking and device action regression tests
        run: dotnet run --project tests/WindowBehaviorTests -c Release
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/build_release.ps1
      - name: Check self-contained dependencies
        shell: pwsh
        run: |
          $publish = Get-ChildItem artifacts/staging-*/SNNUAutoLogin-InstallerPayload-win-x64 -Directory | Select-Object -First 1
          python -X utf8 tools/check_deps.py $publish.FullName
      - name: Light and dark WinUI window checks
        shell: pwsh
        run: |
          $publish = Get-ChildItem artifacts/staging-*/SNNUAutoLogin-InstallerPayload-win-x64 -Directory | Select-Object -First 1
          ./tools/test_window_ui.ps1 -Executable (Join-Path $publish.FullName 'SNNUAutoLogin.exe')
      - name: Installer install, launch and uninstall smoke test
        shell: pwsh
        run: ./tools/test_installer.ps1 -Installer (Resolve-Path artifacts/SNNUAutoLogin-Setup-*.exe)
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: SNNUAutoLogin-Release-win-x64
          path: |
            artifacts/SNNUAutoLogin-Setup-*.exe
            artifacts/SHA256SUMS.txt
            artifacts/windows-ui/**
